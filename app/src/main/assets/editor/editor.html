<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="codemirror.min.css">
  <link rel="stylesheet" href="addon/hint/show-hint.min.css">
  <link rel="stylesheet" href="addon/lint/lint.min.css">
  <style>
    :root {
      --editor-bg: #090d12;
      --editor-fg: #e6edf3;
      --editor-gutter-bg: #0d141c;
      --editor-line-number: #718096;
      --editor-border: #263241;
      --editor-panel: #111821;
      --editor-panel-border: #536476;
      --editor-cursor: #8be9c1;
      --editor-muted: #c2cfdc;
      --editor-selection: #26485e;
      --editor-active-line: #101b25;
      --editor-search-match: #4a3a13;
      --editor-search-current: #b77900;
      --editor-search-ring: #ffd166;
      --editor-keyword: #569cd6;
      --editor-builtin: #dcdcaa;
      --editor-variable-2: #9cdcfe;
      --editor-variable: #d4d4d4;
      --editor-string: #ce9178;
      --editor-number: #b5cea8;
      --editor-comment: #6a9955;
      --editor-type: #4ec9b0;
      --editor-error: #f44747;
      --editor-hint-active: #26485e;
      --editor-hint-kind: #75beff;
      --editor-hint-label: #d4d4d4;
      --editor-hint-detail: #8b98a8;
      --editor-shadow: #000b;
      --editor-hint-shadow: #0005;
    }
    html, body {
      margin: 0;
      padding: 0;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--editor-bg);
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .CodeMirror {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: auto !important;
      height: auto !important;
      background: var(--editor-bg);
      color: var(--editor-fg);
      font-family: "JetBrains Mono", "Roboto Mono", monospace;
      font-size: 14px;
      line-height: 1.5;
    }
    .CodeMirror-gutters {
      background: var(--editor-gutter-bg);
      border-right: 1px solid var(--editor-border);
    }
    .CodeMirror-linenumber {
      color: var(--editor-line-number);
    }
    .CodeMirror-cursor {
      border-left: 2px solid var(--editor-cursor);
    }
    #findPanel {
      display: none;
      position: relative;
      flex: 0 0 auto;
      width: auto;
      margin: 8px;
      padding: 9px;
      background: var(--editor-panel);
      border: 1px solid var(--editor-panel-border);
      border-radius: 12px;
      box-shadow: 0 8px 28px var(--editor-shadow);
    }
    #findPanel.visible {
      display: block;
    }
    .find-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }
    .find-row:last-child {
      margin-bottom: 0;
    }
    .find-input {
      min-width: 0;
      flex: 1;
      height: 38px;
      box-sizing: border-box;
      padding: 0 10px;
      color: var(--editor-fg);
      background: var(--editor-bg);
      border: 1px solid var(--editor-panel-border);
      border-radius: 8px;
      font: 14px "Roboto Mono", monospace;
      outline: none;
    }
    .find-button {
      min-width: 40px;
      height: 38px;
      padding: 0 10px;
      color: var(--editor-fg);
      background: var(--editor-panel);
      border: 1px solid var(--editor-panel-border);
      border-radius: 8px;
      font-size: 13px;
    }
    .find-button.secondary {
      color: var(--editor-fg);
      background: var(--editor-panel);
      border-color: var(--editor-panel-border);
    }
    #findStatus {
      color: var(--editor-muted);
      font: 12px "Roboto Mono", monospace;
      white-space: nowrap;
    }
    .CodeMirror-selected {
      background: var(--editor-selection) !important;
    }
    .CodeMirror-activeline-background {
      background: var(--editor-active-line);
    }
    .pocket-search-match {
      background: var(--editor-search-match);
      border-radius: 2px;
    }
    .pocket-search-current {
      background: var(--editor-search-current);
      box-shadow: inset 0 0 0 2px var(--editor-search-ring);
      border-radius: 3px;
    }
    .CodeMirror .cm-keyword { color: var(--editor-keyword); }
    .CodeMirror .cm-builtin, .CodeMirror .cm-def { color: var(--editor-builtin); }
    .CodeMirror .cm-variable-2 { color: var(--editor-variable-2); }
    .CodeMirror .cm-variable,
    .CodeMirror .cm-variable-3,
    .CodeMirror .cm-property { color: var(--editor-variable); }
    .CodeMirror .cm-string, .CodeMirror .cm-string-2 { color: var(--editor-string); }
    .CodeMirror .cm-number { color: var(--editor-number); }
    .CodeMirror .cm-comment { color: var(--editor-comment); }
    .CodeMirror .cm-type { color: var(--editor-type); }
    .CodeMirror .cm-atom { color: var(--editor-keyword); }
    .CodeMirror .cm-operator, .CodeMirror .cm-punctuation { color: var(--editor-variable); }
    .CodeMirror .cm-meta, .CodeMirror .cm-tag { color: var(--editor-keyword); }
    .CodeMirror .cm-header { color: var(--editor-keyword); font-weight: 700; }
    .CodeMirror .cm-link { color: var(--editor-type); }
    .CodeMirror .cm-quote { color: var(--editor-comment); }
    .CodeMirror .cm-error, .CodeMirror .cm-invalidchar { color: var(--editor-error) !important; }
    .CodeMirror-lint-mark-error {
      border-bottom: none !important;
      text-decoration-line: underline;
      text-decoration-style: wavy;
      text-decoration-color: var(--editor-error);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }
    .CodeMirror-lint-marker-error {
      content: "●";
      color: var(--editor-error);
    }
    .CodeMirror-lint-tooltip {
      color: var(--editor-fg) !important;
      background: var(--editor-panel) !important;
      border: 1px solid var(--editor-panel-border) !important;
      border-radius: 8px !important;
      box-shadow: 0 8px 26px var(--editor-shadow) !important;
      font: 12px/1.5 "Roboto Mono", monospace !important;
      max-width: 360px !important;
      padding: 7px 9px !important;
    }
    .CodeMirror-hints {
      background: var(--editor-panel);
      border: 1px solid var(--editor-panel-border);
      border-radius: 10px;
      box-shadow: 0 8px 28px var(--editor-hint-shadow);
      color: var(--editor-fg);
      font-family: "JetBrains Mono", "Roboto Mono", monospace;
      font-size: 14px;
      max-height: 240px;
      min-width: min(340px, 88vw);
    }
    .CodeMirror-hint {
      color: var(--editor-fg);
      padding: 6px 9px;
    }
    li.CodeMirror-hint-active {
      background: var(--editor-hint-active);
      color: var(--editor-fg);
    }
    .pocket-hint {
      display: grid;
      grid-template-columns: 20px minmax(90px, auto) 1fr;
      gap: 7px;
      align-items: center;
    }
    .pocket-hint-kind {
      color: var(--editor-hint-kind);
      font-size: 12px;
      text-align: center;
    }
    .pocket-hint-label {
      color: var(--editor-variable);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pocket-hint-detail {
      color: var(--editor-hint-detail);
      font: 11px "Roboto Mono", monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="findPanel">
    <div class="find-row">
      <input id="findQuery" class="find-input" placeholder="搜索">
      <button class="find-button" id="findPrev">上一个</button>
      <button class="find-button" id="findNext">下一个</button>
      <button class="find-button secondary" id="findClose">关闭</button>
    </div>
    <div class="find-row">
      <input id="replaceText" class="find-input" placeholder="替换为">
      <button class="find-button" id="replaceOne">替换</button>
      <button class="find-button" id="replaceAll">全部替换</button>
    </div>
    <div class="find-row">
      <span id="findStatus"></span>
    </div>
  </div>
  <textarea id="editor"></textarea>

  <script src="addon/edit/closebrackets.min.js"></script>
  <script src="addon/edit/matchbrackets.min.js"></script>
  <script src="addon/hint/show-hint.min.js"></script>
  <script src="addon/search/searchcursor.min.js"></script>
  <script src="addon/lint/lint.min.js"></script>

  <script src="mode/python.min.js"></script>
  <script src="mode/shell.min.js"></script>
  <script src="mode/markdown.min.js"></script>

    CodeMirror.defineSimpleMode("pocket-kotlin", {
      start: [
        {regex: /\/\/.*/, token: "comment"},
        {regex: /\/\*/, token: "comment", next: "comment"},
        {regex: /"(?:[^\\"]|\\.)*"?/, token: "string"},
        {regex: /'(?:[^\\']|\\.)*'?/, token: "string"},
        {regex: /\b(?:package|import|class|object|interface|fun|val|var|if|else|when|for|while|return|try|catch|finally|private|public|internal|protected|suspend|data|sealed|override|companion|lateinit|is|in|as|by)\b/, token: "keyword"},
        {regex: /\b(?:String|Int|Long|Boolean|Float|Double|List|Map|Set|Any|Unit|Flow|Result|ByteArray)\b/, token: "type"},
        {regex: /\b(?:true|false|null)\b/, token: "atom"},
        {regex: /\b\d+(?:\.\d+)?\b/, token: "number"},
        {regex: /@[A-Za-z_][\w.]*/, token: "def"},
        {regex: /[A-Za-z_]\w*(?=\s*\()/, token: "def"},
        {regex: /[+\-*\/%=<>!&|?:]+/, token: "operator"},
        {regex: /[{}[\]();,.]/, token: "punctuation"}
      ],
      comment: [
        {regex: /.*?\*\//, token: "comment", next: "start"},
        {regex: /.*/, token: "comment"}
      ],
      meta: {dontIndentStates: ["comment"], lineComment: "//"}
    });

      typescript: ["string", "number", "boolean", "unknown", "never", "any", "Array", "Promise", "Record", "Partial", "Readonly"]
    };

    const shellVariables = [
      ["PATH", "可执行文件搜索路径"], ["HOME", "用户主目录"], ["PWD", "当前目录"],
      ["SHELL", "当前 Shell"], ["TMPDIR", "临时目录"], ["PREFIX", "开发环境前缀"],
      ["TERMUX_PREFIX", "内置环境前缀"], ["?", "上一条命令退出码"],
      ["#", "参数数量"], ["0", "脚本名称"], ["@", "全部参数"], ["*", "全部参数"]
    ];

    const moduleCompletions = {
      python: [
        ["os", "操作系统接口"], ["sys", "解释器接口"], ["json", "JSON 编解码"],
        ["pathlib", "路径操作"], ["subprocess", "子进程"], ["asyncio", "异步编程"],
        ["dataclasses", "数据类"], ["typing", "类型标注"], ["collections", "容器类型"],
        ["logging", "日志"], ["re", "正则表达式"], ["datetime", "日期时间"]
      ],
      java: [
        ["java.util.List", "列表"], ["java.util.Map", "映射"],
        ["java.util.Set", "集合"], ["java.util.ArrayList", "动态数组"],
        ["java.util.HashMap", "哈希映射"], ["java.io.File", "文件路径"],
        ["java.nio.file.Files", "文件操作"], ["java.nio.file.Path", "路径"],
        ["java.time.Instant", "时间点"], ["java.util.concurrent", "并发工具"]
      ],
      javascript: [
        ["fs", "文件系统"], ["path", "路径工具"], ["http", "HTTP 服务"],
        ["https", "HTTPS 服务"], ["os", "操作系统"], ["url", "URL 工具"],
        ["crypto", "加密工具"], ["child_process", "子进程"]
      ],
      typescript: [
        ["fs", "文件系统"], ["path", "路径工具"], ["http", "HTTP 服务"],
        ["https", "HTTPS 服务"], ["os", "操作系统"], ["url", "URL 工具"],
        ["crypto", "加密工具"], ["child_process", "子进程"]
      ]
    };

    let currentMode = "plain";
    let currentDirty = false;
    let suppressEvents = false;
    let contentTimer = 0;
    let positionTimer = 0;
    let completionTimer = 0;
    let lastAutoCompletionKey = "";
    let searchMarks = [];
    let activeSearchMatch = null;
    let serverDiagnostics = [];

    const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
      mode: null,
      lineNumbers: true,
      lineWrapping: false,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      smartIndent: true,
      electricChars: true,
      autoCloseBrackets: true,
      matchBrackets: true,
      gutters: ["CodeMirror-linenumbers", "CodeMirror-lint-markers"],
      lint: {getAnnotations: currentDiagnostics, delay: 180},
      hintOptions: {completeSingle: false, alignWithWord: true, closeOnUnfocus: true},
      viewportMargin: 18,
      scrollbarStyle: "native",
      inputStyle: "contenteditable",
      styleActiveLine: true,
      extraKeys: {
        "Ctrl-Space": cm => showCompletions(cm, true),
        "Cmd-Space": cm => showCompletions(cm, true),
        "Ctrl-F": () => openSearch(),
        "Cmd-F": () => openSearch(),
        "Ctrl-Shift-Z": cm => cm.redo(),
        "Cmd-Shift-Z": cm => cm.redo(),
        "Ctrl-Y": cm => cm.redo(),
        "F12": cm => goToDefinition(cm)
      }
    });

    const findPanel = document.getElementById("findPanel");
    const findQuery = document.getElementById("findQuery");
    const replaceText = document.getElementById("replaceText");
    const findStatus = document.getElementById("findStatus");

    function refreshSearchMarks() {
      searchMarks.forEach(mark => mark.clear());
      searchMarks = [];
      const query = findQuery.value;
      if (!query) return 0;
      let count = 0;
      const cursor = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
      while (cursor.findNext()) {
        const from = cursor.from();
        const to = cursor.to();
        const active = activeSearchMatch &&
          CodeMirror.cmpPos(from, activeSearchMatch.from) === 0 &&
          CodeMirror.cmpPos(to, activeSearchMatch.to) === 0;
        searchMarks.push(editor.markText(
          from,
          to,
          {
            className: active ? "pocket-search-current" : "pocket-search-match",
            inclusiveLeft: false,
            inclusiveRight: false
          }
        ));
        count++;
      }
      return count;
    }

    function updateFindStatus(extra) {
      const query = findQuery.value;
      if (!query) {
        refreshSearchMarks();
        findStatus.textContent = "";
        return;
      }
      const count = refreshSearchMarks();
      findStatus.textContent = extra ? `${extra} · 共 ${count} 处` : `共 ${count} 处`;
    }

    function openSearch() {
      const selected = editor.getSelection();
      if (selected && !selected.includes("\n")) findQuery.value = selected;
      findPanel.classList.add("visible");
      updateFindStatus();
      findQuery.focus();
      findQuery.select();
    }

    function closeSearch() {
      findPanel.classList.remove("visible");
      searchMarks.forEach(mark => mark.clear());
      searchMarks = [];
      activeSearchMatch = null;
      editor.focus();
    }

    function findMatch(backwards) {
      const query = findQuery.value;
      if (!query) return;
      const origin = editor.getCursor(backwards ? "start" : "end");
      if (!backwards) {
        const cursor = editor.getSearchCursor(query, origin, {caseFold: true});
        if (cursor.findNext()) {
          editor.setSelection(cursor.from(), cursor.to());
          activeSearchMatch = {from: cursor.from(), to: cursor.to()};
          editor.scrollIntoView({from: cursor.from(), to: cursor.to()}, 80);
          updateFindStatus();
          return;
        }
        const wrapped = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
        if (wrapped.findNext()) {
          editor.setSelection(wrapped.from(), wrapped.to());
          activeSearchMatch = {from: wrapped.from(), to: wrapped.to()};
          editor.scrollIntoView({from: wrapped.from(), to: wrapped.to()}, 80);
          updateFindStatus("已回到第一个匹配");
          return;
        }
      } else {
        const cursor = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
        let previous = null;
        while (cursor.findNext()) {
          const match = {from: cursor.from(), to: cursor.to()};
          if (CodeMirror.cmpPos(cursor.from(), origin) < 0) previous = match;
          else break;
        }
        if (previous) {
          editor.setSelection(previous.from, previous.to);
          activeSearchMatch = previous;
          editor.scrollIntoView(previous, 80);
          updateFindStatus();
          return;
        }
        const wrapped = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
        let finalMatch = null;
        while (wrapped.findNext()) {
          finalMatch = {from: wrapped.from(), to: wrapped.to()};
        }
        if (finalMatch) {
          editor.setSelection(finalMatch.from, finalMatch.to);
          activeSearchMatch = finalMatch;
          editor.scrollIntoView(finalMatch, 80);
          updateFindStatus("已跳到最后一个匹配");
          return;
        }
      }
      findStatus.textContent = `未找到“${query}”`;
    }

    function replaceOne() {
      const query = findQuery.value;
      if (!query) return;
      const replacement = replaceText.value;
      if (editor.getSelection().toLocaleLowerCase() === query.toLocaleLowerCase()) {
        editor.replaceSelection(replacement);
        activeSearchMatch = null;
        updateFindStatus("已替换 1 处");
        findMatch(false);
      } else {
        findMatch(false);
      }
    }

    function replaceEveryMatch() {
      const query = findQuery.value;
      if (!query) return;
      const replacement = replaceText.value;
      let replaced = 0;
      activeSearchMatch = null;
      editor.operation(() => {
        const cursor = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
        while (cursor.findNext()) {
          cursor.replace(replacement);
          replaced++;
        }
      });
      updateFindStatus(`已替换 ${replaced} 处`);
    }

    document.getElementById("findPrev").addEventListener("click", () => findMatch(true));
    document.getElementById("findNext").addEventListener("click", () => findMatch(false));
    document.getElementById("findClose").addEventListener("click", closeSearch);
    document.getElementById("replaceOne").addEventListener("click", replaceOne);
    document.getElementById("replaceAll").addEventListener("click", replaceEveryMatch);
    findQuery.addEventListener("input", () => {
      activeSearchMatch = null;
      updateFindStatus();
    });
    findQuery.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        findMatch(event.shiftKey);
      }
      if (event.key === "Escape") closeSearch();
    });
    replaceText.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        replaceOne();
      }
      if (event.key === "Escape") closeSearch();
    });

    function bridge() {
      return window.PocketEditorBridge || null;
    }

    function publishHistoryState() {
      const api = bridge();
      if (!api || !api.onHistoryChanged) return;
      const size = editor.historySize();
      api.onHistoryChanged(size.undo > 0, size.redo > 0);
    }

    function currentDiagnostics() {
      return serverDiagnostics;
    }

    function sendPosition() {
      clearTimeout(positionTimer);
      positionTimer = setTimeout(() => {
        const pos = editor.getCursor();
        const api = bridge();
        if (api && api.onCursorChanged) api.onCursorChanged(pos.line + 1, pos.ch + 1);
      }, 80);
    }

    function flushContent() {
      clearTimeout(contentTimer);
      contentTimer = 0;
      const api = bridge();
      if (api && api.onContentChanged) api.onContentChanged(editor.getValue());
    }

    const kindBadges = {
      keyword: "K",
      type: "T",
      function: "ƒ",
      variable: "V",
      snippet: "S",
      property: "P",
      module: "M",
      symbol: "◆"
    };
    const kindPriority = {
      snippet: 5,
      function: 4,
      property: 4,
      variable: 3,
      type: 3,
      keyword: 2,
      module: 2,
      symbol: 1
    };

    function completionItem(
      label,
      detail,
      kind,
      insertText = label,
      cursorOffset = null
    ) {
      return {
        label,
        text: insertText,
        displayText: label,
        detail,
        kind,
        insertText,
        cursorOffset,
        render: renderCompletion
      };
    }

    function renderCompletion(node, self, item) {
      node.className += " pocket-hint";
      node.title = [item.detail, item.documentation].filter(Boolean).join("\n");
      const badge = document.createElement("span");
      badge.className = "pocket-hint-kind";
      badge.textContent = kindBadges[item.kind] || "•";
      const label = document.createElement("span");
      label.className = "pocket-hint-label";
      label.textContent = item.label;
      const detail = document.createElement("span");
      detail.className = "pocket-hint-detail";
      detail.textContent = item.detail || "";
      node.appendChild(badge);
      node.appendChild(label);
      node.appendChild(detail);
    }

    function positionAfter(from, text, offset) {
      const before = text.slice(0, Math.max(0, Math.min(offset, text.length)));
      const lines = before.split("\n");
      if (lines.length === 1) return CodeMirror.Pos(from.line, from.ch + lines[0].length);
      return CodeMirror.Pos(from.line + lines.length - 1, lines[lines.length - 1].length);
    }

    function snippetHint(cm, data, item) {
      const from = item.from || data.from;
      const to = item.to || data.to;
      cm.replaceRange(item.insertText, from, to, "complete");
      const cursor = positionAfter(from, item.insertText, item.cursorOffset);
      cm.setCursor(cursor);
      cm.scrollIntoView(cursor, 60);
    }

    function addSnippetCandidates(target, prefix) {
      (snippets[currentMode] || []).forEach(item => {
        if (prefix && !item.label.toLowerCase().startsWith(prefix.toLowerCase())) return;
        target.push({
          label: item.label,
          text: item.insertText,
          displayText: item.label,
          detail: item.detail,
          kind: "snippet",
          insertText: item.insertText,
          cursorOffset: item.cursorOffset,
          render: renderCompletion,
          hint: snippetHint
        });
      });
    }

    function similarityScore(label, prefix) {
      if (!prefix) return 1;
      const value = label.toLowerCase();
      const query = prefix.toLowerCase();
      if (value === query) return 1200;
      if (value.startsWith(query)) return 1000 - Math.min(300, value.length - query.length);
      let queryIndex = 0;
      let gap = 0;
      for (let index = 0; index < value.length && queryIndex < query.length; index++) {
        if (value[index] === query[queryIndex]) {
          queryIndex++;
        } else if (queryIndex > 0) {
          gap++;
        }
      }
      return queryIndex === query.length ? 500 - Math.min(300, gap) : -1;
    }

    function rankAndLimit(candidates, prefix) {
      const unique = new Map();
      candidates.forEach(item => {
        const key = item.label.toLowerCase();
        const existing = unique.get(key);
        if (
          !existing ||
          (kindPriority[item.kind] || 0) > (kindPriority[existing.kind] || 0)
        ) {
          unique.set(key, item);
        }
      });
      return Array.from(unique.values())
        .map(item => ({item, score: similarityScore(item.label, prefix)}))
        .filter(entry => entry.score >= 0)
        .sort((left, right) =>
          right.score - left.score ||
          (kindPriority[right.item.kind] || 0) - (kindPriority[left.item.kind] || 0) ||
          left.item.label.length - right.item.label.length ||
          left.item.label.localeCompare(right.item.label)
        )
        .slice(0, 40)
        .map(entry => entry.item);
    }

    function localShellVariables(source) {
      const names = new Set();
      const assignment = /(?:^|[\s;])([A-Za-z_][A-Za-z0-9_]*)=/gm;
      let match;
      while ((match = assignment.exec(source)) && names.size < 150) {
        names.add(match[1]);
      }
      return Array.from(names);
    }

    function localPythonMethods(source) {
      const methods = new Set();
      const definition = /^\s*def\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(/gm;
      let match;
      while ((match = definition.exec(source)) && methods.size < 150) {
        methods.add(match[1]);
      }
      return Array.from(methods);
    }

    function pocketHint(cm, manual = false) {
      const cursor = cm.getCursor();
      const before = cm.getRange({line: cursor.line, ch: 0}, cursor);
      const source = cm.getValue();
      let match = /([A-Za-z_][A-Za-z0-9_]*)$/.exec(before);
      let word = match ? match[1] : "";
      let start = cursor.ch - word.length;
      const shellVariable = currentMode === "shell" &&
        /\$(?:\{?)([A-Za-z0-9_?@*#]*)$/.exec(before);
      const property = /([A-Za-z_$][A-Za-z0-9_$]*)\.([A-Za-z0-9_$]*)$/.exec(before);
      if (!match && !manual && !shellVariable && !property) return null;
      if (!match && (shellVariable || property)) {
        word = "";
        start = cursor.ch;
      }

      const candidates = [];
      const metadata = completionMetadata[currentMode] || {};
      (completions[currentMode] || []).forEach(value => {
        const meta = metadata[value];
        const kind = meta ? meta[0] :
          ((typeCompletions[currentMode] || []).includes(value) ? "type" : "keyword");
        candidates.push(completionItem(
          value,
          meta ? `${meta[1]}${meta[2] ? ` · ${meta[2]}` : ""}` :
            (kind === "type" ? "类型" : "关键字"),
          kind
        ));
      });
      addSnippetCandidates(candidates, word);

      if (
        property &&
        (
          currentMode === "javascript" ||
          currentMode === "typescript" ||
          currentMode === "java"
        )
      ) {
        (propertyCompletions[property[1]] || []).forEach(([label, detail]) => {
          candidates.push(completionItem(label, detail, "property"));
          start = cursor.ch - word.length;
        });
      }
      if (property && currentMode === "python" && property[1] === "self") {
        localPythonMethods(source).forEach(label => {
          candidates.push(completionItem(label, "当前类方法", "function"));
        });
      }

      if (
        (currentMode === "python" && /^\s*(?:from|import)\s+[A-Za-z0-9_]*$/.test(before)) ||
        ((currentMode === "javascript" || currentMode === "typescript") &&
          /^\s*import\b.*\bfrom\s+["']?[A-Za-z0-9_]*$/.test(before)) ||
        (currentMode === "java" && /^\s*import\s+[A-Za-z0-9_.]*$/.test(before))
      ) {
        (moduleCompletions[currentMode] || []).forEach(([label, detail]) => {
          candidates.push(completionItem(label, detail, "module"));
        });
      }

      if (word.length >= 1 || manual) {
        const symbols = new Set(source.match(/[A-Za-z_][A-Za-z0-9_]*/g) || []);
        Array.from(symbols).slice(0, 1200).forEach(value => {
          if (value.length >= 2) {
            candidates.push(completionItem(value, "当前文件", "symbol"));
          }
        });
      }

      if (currentMode === "shell" && (shellVariable || manual || word.startsWith("$"))) {
        const variablePrefix = shellVariable ? shellVariable[1] : "";
        if (shellVariable) {
          start = cursor.ch - variablePrefix.length;
          word = variablePrefix;
        }
        shellVariables.forEach(([label, detail]) => {
          const displayLabel = shellVariable ? label : `$${label}`;
          candidates.push(completionItem(
            displayLabel,
            detail,
            "variable",
            displayLabel
          ));
        });
        localShellVariables(source).forEach(label => {
          const displayLabel = shellVariable ? label : `$${label}`;
          candidates.push(completionItem(
            displayLabel,
            "Shell 变量",
            "variable",
            displayLabel
          ));
        });
      }

      const list = rankAndLimit(candidates, word);
      if (!list.length) return null;
      return {
        list,
        from: CodeMirror.Pos(cursor.line, Math.max(0, start)),
        to: cursor
      };
    }

    function showCompletions(cm, manual = false) {
      cm.showHint({
        hint: editor => pocketHint(editor, manual),
        completeSingle: false,
        alignWithWord: true,
        closeOnUnfocus: true
      });
    }

    function goToDefinition(cm) {
      const cursor = cm.getCursor();
      const token = cm.getTokenAt(cursor);
      const tokenMatch = /([A-Za-z_][A-Za-z0-9_]*)/.exec(token.string);
      if (!tokenMatch) return;
      const name = tokenMatch[1];
      const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const patterns = currentMode === "shell"
        ? [new RegExp(`^\\s*(?:function\\s+)?${escaped}\\s*\\(\\)`)]
        : currentMode === "python"
          ? [new RegExp(`^\\s*(?:def|class)\\s+${escaped}\\b`)]
          : [new RegExp(`\\b(?:function|class|const|let|var|fun)\\s+${escaped}\\b`)];
      const lines = cm.getValue().split("\n");
      for (let line = 0; line < lines.length; line++) {
        if (line === cursor.line) continue;
        if (patterns.some(pattern => pattern.test(lines[line]))) {
          const ch = Math.max(0, lines[line].indexOf(name));
          const target = CodeMirror.Pos(line, ch);
          cm.setCursor(target);
          cm.scrollIntoView(target, 120);
          cm.focus();
          return;
        }
      }
    }

    editor.on("change", (cm, change) => {
      if (suppressEvents) return;
      currentDirty = true;
      activeSearchMatch = null;
      const api = bridge();
      if (api && api.onDirtyChanged) api.onDirtyChanged(true);
      clearTimeout(contentTimer);
      contentTimer = setTimeout(flushContent, 250);
      if (findPanel.classList.contains("visible")) {
        setTimeout(() => updateFindStatus(), 0);
      }
      publishHistoryState();
      if (
        !cm.state.completionActive &&
        change.origin !== "undo" &&
        change.origin !== "redo"
      ) {
        const inserted = (change.text || []).join("\n");
        if (inserted && /[A-Za-z0-9_$\.]$/.test(inserted)) {
          clearTimeout(completionTimer);
          completionTimer = setTimeout(() => {
            if (cm.state.completionActive) return;
            const cursor = cm.getCursor();
            const before = cm.getRange({line: cursor.line, ch: 0}, cursor);
            const wordMatch = /([A-Za-z_][A-Za-z0-9_]*)$/.exec(before);
            const trigger = /(?:\$|\.[A-Za-z0-9_]*)$/.test(before);
            if (!wordMatch && !trigger) return;
            const key = `${currentMode}:${cursor.line}:${cursor.ch}:${wordMatch ? wordMatch[1] : ""}`;
            if (key === lastAutoCompletionKey) return;
            lastAutoCompletionKey = key;
            showCompletions(cm, false);
          }, 50);
        }
      }
    });
    editor.on("cursorActivity", sendPosition);
    editor.on("blur", flushContent);

    window.PocketEditor = {
      setValue(text) {
        suppressEvents = true;
        const cursor = editor.getCursor();
        editor.setValue(text || "");
        editor.setCursor(Math.min(cursor.line, Math.max(0, editor.lineCount() - 1)), 0);
        currentDirty = false;
        suppressEvents = false;
        if (editor.clearHistory) editor.clearHistory();
        publishHistoryState();
        editor.performLint();
        setTimeout(() => editor.refresh(), 0);
        if (findPanel.classList.contains("visible")) {
          setTimeout(() => updateFindStatus(), 0);
        }
      },
      setMode(mode) {
        currentMode = mode in modes ? mode : "plain";
        editor.setOption("mode", modes[currentMode]);
        editor.performLint();
        setTimeout(() => editor.refresh(), 0);
      },
      getValue() {
        return editor.getValue();
      },
      focus() {
        editor.focus();
      },
      showCompletions() {
        editor.focus();
        setTimeout(() => showCompletions(editor, true), 80);
      },
      undo() {
        editor.undo();
        publishHistoryState();
        editor.focus();
      },
      redo() {
        editor.redo();
        publishHistoryState();
        editor.focus();
      },
      openSearch() {
        openSearch();
      },
      goTo(line, column) {
        const target = CodeMirror.Pos(
          Math.max(0, Number(line) - 1),
          Math.max(0, Number(column) - 1)
        );
        editor.setCursor(target);
        editor.scrollIntoView(target, 80);
        editor.focus();
      },
      applyFix(line, column, replacement) {
        const from = CodeMirror.Pos(
          Math.max(0, Number(line) - 1),
          Math.max(0, Number(column) - 1)
        );
        const to = CodeMirror.Pos(from.line, from.ch + 1);
        editor.replaceRange(String(replacement), from, to, "+quickfix");
        editor.setCursor(CodeMirror.Pos(from.line, from.ch + String(replacement).length));
        editor.focus();
      },
      insertText(text, cursorOffset) {
        const value = String(text == null ? "" : text);
        const start = editor.getCursor("from");
        editor.focus();
        editor.replaceSelection(value, "end", "+input");
        const requested = Number(cursorOffset);
        const offset = Number.isFinite(requested)
          ? Math.max(0, Math.min(Math.floor(requested), value.length))
          : value.length;
        const cursor = positionAfter(start, value, offset);
        editor.setCursor(cursor);
        editor.scrollIntoView(cursor, 32);
        sendPosition();
        publishHistoryState();
      },
      goToDefinition() {
        goToDefinition(editor);
      },
      setDiagnostics(diagnostics) {
        serverDiagnostics = (Array.isArray(diagnostics) ? diagnostics : []).map(item => {
          if (item.from) return item;
          const line = Math.max(0, Number(item.line) || 0);
          const ch = Math.max(0, Number(item.ch) || 0);
          return {
            from: CodeMirror.Pos(line, ch),
            to: CodeMirror.Pos(line, ch + 1),
            severity: item.severity || "error",
            message: item.message || "语法错误",
            replacement: item.replacement || null
          };
        });
        editor.performLint();
      },
      flush() {
        flushContent();
      },
      refresh() {
        refreshEditorViewport();
      },
      setTheme(theme) {
        if (!theme || typeof theme !== "object") return;
        Object.entries(theme).forEach(([name, value]) => {
          if (typeof value === "string" && value.length > 0) {
            document.documentElement.style.setProperty(`--${name}`, value);
          }
        });
        document.body.style.background = getComputedStyle(document.documentElement)
          .getPropertyValue("--editor-bg").trim();
        editor.refresh();
      }
    };

    let viewportFrame = 0;
    let previousEditorHeight = editor.getWrapperElement().clientHeight;
    function refreshEditorViewport() {
      if (viewportFrame) return;
      viewportFrame = requestAnimationFrame(() => {
        viewportFrame = 0;
        const height = editor.getWrapperElement().clientHeight;
        const shrinking = height < previousEditorHeight;
        previousEditorHeight = height;
        const scroll = editor.getScrollInfo();
        editor.refresh();
        editor.scrollTo(scroll.left, scroll.top);
        // Keep the reading position when the keyboard closes or the user is
        // browsing. While editing, move only as far as needed to reveal the caret.
        if (shrinking && editor.hasFocus()) {
          editor.scrollIntoView(editor.getCursor(), 8);
        }
      });
    }

    if (window.ResizeObserver) {
      new ResizeObserver(refreshEditorViewport).observe(editor.getWrapperElement());
    }

    window.addEventListener("resize", refreshEditorViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", refreshEditorViewport);
    }

    setTimeout(() => {
      editor.refresh();
      const api = bridge();
      if (api && api.onReady) api.onReady();
    }, 30);
  </script>
</body>
</html>
