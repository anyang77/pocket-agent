<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="codemirror.min.css">
  <link rel="stylesheet" href="addon/hint/show-hint.min.css">
  <link rel="stylesheet" href="addon/lint/lint.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d12;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .CodeMirror {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: auto !important;
      height: auto !important;
      background: #090d12;
      color: #e6edf3;
      font-family: "JetBrains Mono", "Roboto Mono", monospace;
      font-size: 14px;
      line-height: 1.5;
    }
    .CodeMirror-gutters {
      background: #0d141c;
      border-right: 1px solid #263241;
    }
    .CodeMirror-linenumber {
      color: #718096;
    }
    .CodeMirror-cursor {
      border-left: 2px solid #8be9c1;
    }
    #findPanel {
      display: none;
      position: relative;
      flex: 0 0 auto;
      width: auto;
      margin: 8px;
      padding: 9px;
      background: #111821;
      border: 1px solid #536476;
      border-radius: 12px;
      box-shadow: 0 8px 28px #000b;
    }
    #findPanel.visible {
      display: block;
    }
    .find-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }
    .find-row:last-child {
      margin-bottom: 0;
    }
    .find-input {
      min-width: 0;
      flex: 1;
      height: 38px;
      box-sizing: border-box;
      padding: 0 10px;
      color: #e6edf3;
      background: #090d12;
      border: 1px solid #536476;
      border-radius: 8px;
      font: 14px "Roboto Mono", monospace;
      outline: none;
    }
    .find-button {
      min-width: 40px;
      height: 38px;
      padding: 0 10px;
      color: #d5faec;
      background: #173d32;
      border: 1px solid #365f50;
      border-radius: 8px;
      font-size: 13px;
    }
    .find-button.secondary {
      color: #e6edf3;
      background: #1b2632;
      border-color: #536476;
    }
    #findStatus {
      color: #c2cfdc;
      font: 12px "Roboto Mono", monospace;
      white-space: nowrap;
    }
    .CodeMirror-selected {
      background: #26485e !important;
    }
    .CodeMirror-activeline-background {
      background: #101b25;
    }
    .pocket-search-match {
      background: #4a3a13;
      border-radius: 2px;
    }
    .pocket-search-current {
      background: #b77900;
      box-shadow: inset 0 0 0 2px #ffd166;
      border-radius: 3px;
    }
    .cm-keyword, .cm-builtin { color: #82aaff; font-weight: 600; }
    .cm-def, .cm-variable-2 { color: #c792ea; }
    .cm-variable, .cm-variable-3 { color: #d6deeb; }
    .cm-string, .cm-string-2 { color: #a5d6a7; }
    .cm-number { color: #e5c07b; }
    .cm-comment { color: #7f8c98; font-style: italic; }
    .cm-type, .cm-atom { color: #66c2cd; }
    .cm-operator { color: #f07178; }
    .cm-punctuation { color: #d6deeb; }
    .cm-meta, .cm-tag { color: #d7a86e; }
    .cm-header { color: #82aaff; font-weight: 700; }
    .cm-link { color: #66c2cd; }
    .cm-quote { color: #a5d6a7; }
    .CodeMirror-lint-mark-error {
      border-bottom: none !important;
      text-decoration-line: underline;
      text-decoration-style: wavy;
      text-decoration-color: #f85149;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }
    .CodeMirror-lint-marker-error {
      content: "●";
      color: #f85149;
    }
    .CodeMirror-hints {
      background: #111821;
      border: 1px solid #536476;
      border-radius: 10px;
      box-shadow: 0 8px 28px #0009;
      color: #e6edf3;
      font-family: "JetBrains Mono", "Roboto Mono", monospace;
      font-size: 14px;
      max-height: 240px;
    }
    .CodeMirror-hint {
      color: #e6edf3;
      padding: 7px 10px;
    }
    li.CodeMirror-hint-active {
      background: #26485e;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="findPanel">
    <div class="find-row">
      <input id="findQuery" class="find-input" placeholder="搜索">
      <button class="find-button" id="findPrev">上一个</button>
      <button class="find-button" id="findNext">下一个</button>
      <button class="find-button secondary" id="findClose">关闭</button>
    </div>
    <div class="find-row">
      <input id="replaceText" class="find-input" placeholder="替换为">
      <button class="find-button" id="replaceOne">替换</button>
      <button class="find-button" id="replaceAll">全部替换</button>
    </div>
    <div class="find-row">
      <span id="findStatus"></span>
    </div>
  </div>
  <textarea id="editor"></textarea>
  <script src="codemirror.min.js"></script>
  <script src="addon/edit/closebrackets.min.js"></script>
  <script src="addon/edit/matchbrackets.min.js"></script>
  <script src="addon/hint/show-hint.min.js"></script>
  <script src="addon/search/searchcursor.min.js"></script>
  <script src="addon/lint/lint.min.js"></script>
  <script src="addon/mode/simple.min.js"></script>
  <script src="mode/clike.min.js"></script>
  <script src="mode/javascript.min.js"></script>
  <script src="mode/python.min.js"></script>
  <script src="mode/shell.min.js"></script>
  <script src="mode/markdown.min.js"></script>
  <script>
    CodeMirror.defineSimpleMode("pocket-kotlin", {
      start: [
        {regex: /\/\/.*/, token: "comment"},
        {regex: /\/\*/, token: "comment", next: "comment"},
        {regex: /"(?:[^\\"]|\\.)*"?/, token: "string"},
        {regex: /'(?:[^\\']|\\.)*'?/, token: "string"},
        {regex: /\b(?:package|import|class|object|interface|fun|val|var|if|else|when|for|while|return|try|catch|finally|private|public|internal|protected|suspend|data|sealed|override|companion|lateinit|is|in|as|by)\b/, token: "keyword"},
        {regex: /\b(?:String|Int|Long|Boolean|Float|Double|List|Map|Set|Any|Unit|Flow|Result|ByteArray)\b/, token: "type"},
        {regex: /\b(?:true|false|null)\b/, token: "atom"},
        {regex: /\b\d+(?:\.\d+)?\b/, token: "number"},
        {regex: /@[A-Za-z_][\w.]*/, token: "def"},
        {regex: /[A-Za-z_]\w*(?=\s*\()/, token: "def"},
        {regex: /[+\-*\/%=<>!&|?:]+/, token: "operator"},
        {regex: /[{}[\]();,.]/, token: "punctuation"}
      ],
      comment: [
        {regex: /.*?\*\//, token: "comment", next: "start"},
        {regex: /.*/, token: "comment"}
      ],
      meta: {dontIndentStates: ["comment"], lineComment: "//"}
    });

    const modes = {
      kotlin: "pocket-kotlin",
      java: "text/x-java",
      cpp: "text/x-c++src",
      python: "python",
      javascript: "javascript",
      typescript: "text/typescript",
      shell: "shell",
      json: {name: "javascript", json: true},
      markdown: "markdown",
      plain: null
    };

    const completions = {
      kotlin: ["package", "import", "class", "object", "interface", "fun", "val", "var", "if", "else", "when", "for", "while", "return", "try", "catch", "private", "public", "suspend", "data", "override", "String", "Int", "Long", "Boolean", "List", "Map", "Result"],
      java: ["package", "import", "class", "interface", "enum", "public", "private", "protected", "static", "final", "void", "new", "return", "if", "else", "for", "while", "try", "catch", "String", "Object", "Integer", "List", "Map"],
      cpp: ["include", "int", "char", "void", "auto", "const", "static", "struct", "class", "namespace", "using", "return", "if", "else", "for", "while", "switch", "break", "vector", "string", "size_t"],
      python: ["def", "class", "import", "from", "as", "if", "elif", "else", "for", "while", "return", "try", "except", "finally", "with", "lambda", "yield", "async", "await", "pass", "break", "continue", "True", "False", "None", "self", "print", "len"],
      javascript: ["const", "let", "var", "function", "class", "import", "export", "from", "if", "else", "for", "while", "return", "async", "await", "try", "catch", "throw", "new", "console", "document", "Promise", "Array", "Object"],
      typescript: ["const", "let", "var", "function", "class", "interface", "type", "import", "export", "from", "if", "else", "for", "while", "return", "async", "await", "try", "catch", "throw", "new", "string", "number", "boolean", "unknown", "Promise", "Record"],
      shell: ["if", "then", "else", "elif", "fi", "for", "while", "do", "done", "case", "esac", "function", "export", "local", "return", "echo", "cd", "pwd", "git", "python", "node", "clang"],
      json: ["true", "false", "null"],
      markdown: ["#", "##", "###", "- [ ]", "```"],
      plain: []
    };

    let currentMode = "plain";
    let currentDirty = false;
    let suppressEvents = false;
    let contentTimer = 0;
    let positionTimer = 0;
    let lastHintWord = "";
    let searchMarks = [];
    let activeSearchMatch = null;
    let serverDiagnostics = [];
    let localDiagnostics = [];
    let localDiagnosticsTimer = 0;

    const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
      mode: null,
      lineNumbers: true,
      lineWrapping: false,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      smartIndent: true,
      electricChars: true,
      autoCloseBrackets: true,
      matchBrackets: true,
      gutters: ["CodeMirror-linenumbers", "CodeMirror-lint-markers"],
      lint: {getAnnotations: currentDiagnostics, delay: 180},
      viewportMargin: 18,
      scrollbarStyle: "native",
      inputStyle: "contenteditable",
      styleActiveLine: true,
      extraKeys: {
        "Ctrl-Space": cm => cm.showHint({hint: pocketHint, completeSingle: false}),
        "Ctrl-F": () => openSearch(),
        "Cmd-F": () => openSearch()
      }
    });

    const findPanel = document.getElementById("findPanel");
    const findQuery = document.getElementById("findQuery");
    const replaceText = document.getElementById("replaceText");
    const findStatus = document.getElementById("findStatus");

    function refreshSearchMarks() {
      searchMarks.forEach(mark => mark.clear());
      searchMarks = [];
      const query = findQuery.value;
      if (!query) return 0;
      let count = 0;
      const cursor = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
      while (cursor.findNext()) {
        const from = cursor.from();
        const to = cursor.to();
        const active = activeSearchMatch &&
          CodeMirror.cmpPos(from, activeSearchMatch.from) === 0 &&
          CodeMirror.cmpPos(to, activeSearchMatch.to) === 0;
        searchMarks.push(editor.markText(
          from,
          to,
          {
            className: active ? "pocket-search-current" : "pocket-search-match",
            inclusiveLeft: false,
            inclusiveRight: false
          }
        ));
        count++;
      }
      return count;
    }

    function updateFindStatus(extra) {
      const query = findQuery.value;
      if (!query) {
        refreshSearchMarks();
        findStatus.textContent = "";
        return;
      }
      const count = refreshSearchMarks();
      findStatus.textContent = extra ? `${extra} · 共 ${count} 处` : `共 ${count} 处`;
    }

    function openSearch() {
      const selected = editor.getSelection();
      if (selected && !selected.includes("\n")) findQuery.value = selected;
      findPanel.classList.add("visible");
      updateFindStatus();
      findQuery.focus();
      findQuery.select();
    }

    function closeSearch() {
      findPanel.classList.remove("visible");
      searchMarks.forEach(mark => mark.clear());
      searchMarks = [];
      activeSearchMatch = null;
      editor.focus();
    }

    function findMatch(backwards) {
      const query = findQuery.value;
      if (!query) return;
      const origin = editor.getCursor(backwards ? "start" : "end");
      if (!backwards) {
        const cursor = editor.getSearchCursor(query, origin, {caseFold: true});
        if (cursor.findNext()) {
          editor.setSelection(cursor.from(), cursor.to());
          activeSearchMatch = {from: cursor.from(), to: cursor.to()};
          editor.scrollIntoView({from: cursor.from(), to: cursor.to()}, 80);
          updateFindStatus();
          return;
        }
        const wrapped = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
        if (wrapped.findNext()) {
          editor.setSelection(wrapped.from(), wrapped.to());
          activeSearchMatch = {from: wrapped.from(), to: wrapped.to()};
          editor.scrollIntoView({from: wrapped.from(), to: wrapped.to()}, 80);
          updateFindStatus("已回到第一个匹配");
          return;
        }
      } else {
        const cursor = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
        let previous = null;
        while (cursor.findNext()) {
          const match = {from: cursor.from(), to: cursor.to()};
          if (CodeMirror.cmpPos(cursor.from(), origin) < 0) previous = match;
          else break;
        }
        if (previous) {
          editor.setSelection(previous.from, previous.to);
          activeSearchMatch = previous;
          editor.scrollIntoView(previous, 80);
          updateFindStatus();
          return;
        }
        const wrapped = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
        let finalMatch = null;
        while (wrapped.findNext()) {
          finalMatch = {from: wrapped.from(), to: wrapped.to()};
        }
        if (finalMatch) {
          editor.setSelection(finalMatch.from, finalMatch.to);
          activeSearchMatch = finalMatch;
          editor.scrollIntoView(finalMatch, 80);
          updateFindStatus("已跳到最后一个匹配");
          return;
        }
      }
      findStatus.textContent = `未找到“${query}”`;
    }

    function replaceOne() {
      const query = findQuery.value;
      if (!query) return;
      const replacement = replaceText.value;
      if (editor.getSelection().toLocaleLowerCase() === query.toLocaleLowerCase()) {
        editor.replaceSelection(replacement);
        activeSearchMatch = null;
        updateFindStatus("已替换 1 处");
        findMatch(false);
      } else {
        findMatch(false);
      }
    }

    function replaceEveryMatch() {
      const query = findQuery.value;
      if (!query) return;
      const replacement = replaceText.value;
      let replaced = 0;
      activeSearchMatch = null;
      editor.operation(() => {
        const cursor = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
        while (cursor.findNext()) {
          cursor.replace(replacement);
          replaced++;
        }
      });
      updateFindStatus(`已替换 ${replaced} 处`);
    }

    document.getElementById("findPrev").addEventListener("click", () => findMatch(true));
    document.getElementById("findNext").addEventListener("click", () => findMatch(false));
    document.getElementById("findClose").addEventListener("click", closeSearch);
    document.getElementById("replaceOne").addEventListener("click", replaceOne);
    document.getElementById("replaceAll").addEventListener("click", replaceEveryMatch);
    findQuery.addEventListener("input", () => {
      activeSearchMatch = null;
      updateFindStatus();
    });
    findQuery.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        findMatch(event.shiftKey);
      }
      if (event.key === "Escape") closeSearch();
    });
    replaceText.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        replaceOne();
      }
      if (event.key === "Escape") closeSearch();
    });

    function bridge() {
      return window.PocketEditorBridge || null;
    }

    function diagnosticAt(text, index, message) {
      const before = text.slice(0, index);
      const line = before.split("\n").length - 1;
      const lastBreak = before.lastIndexOf("\n");
      return {
        from: CodeMirror.Pos(line, index - lastBreak - 1),
        to: CodeMirror.Pos(line, index - lastBreak),
        severity: "error",
        message
      };
    }

    function scanLocalSyntax(text) {
      if (currentMode === "plain" || currentMode === "markdown") return [];
      const diagnostics = [];
      const stack = [];
      const pairs = {")": "(", "]": "[", "}": "{"};
      let quote = null;
      let blockComment = false;
      let lineComment = false;
      for (let index = 0; index < text.length; index++) {
        const ch = text[index];
        const next = text[index + 1];
        if (lineComment) {
          if (ch === "\n") lineComment = false;
          continue;
        }
        if (blockComment) {
          if (ch === "*" && next === "/") {
            blockComment = false;
            index++;
          }
          continue;
        }
        if (quote) {
          if (ch === "\\") {
            index++;
            continue;
          }
          if (ch === quote) quote = null;
          continue;
        }
        if (ch === "/" && next === "/") {
          lineComment = true;
          index++;
          continue;
        }
        if (ch === "/" && next === "*") {
          blockComment = true;
          index++;
          continue;
        }
        if (ch === "#" && (currentMode === "python" || currentMode === "shell")) {
          lineComment = true;
          continue;
        }
        if (
          (ch === '"' || ch === "'") &&
          next === ch &&
          text[index + 2] === ch &&
          (currentMode === "python" || currentMode === "kotlin" || currentMode === "java")
        ) {
          const delimiter = ch + ch + ch;
          const close = text.indexOf(delimiter, index + 3);
          if (close < 0) {
            diagnostics.push(diagnosticAt(text, index, "多行字符串没有闭合"));
            break;
          }
          index = close + 2;
          continue;
        }
        if (ch === '"' || ch === "'" || ch === "`") {
          quote = ch;
          continue;
        }
        if (ch === "(" || ch === "[" || ch === "{") {
          stack.push({char: ch, index});
          continue;
        }
        if (ch === ")" || ch === "]" || ch === "}") {
          const open = stack.pop();
          if (!open || open.char !== pairs[ch]) {
            diagnostics.push(diagnosticAt(text, index, `括号不匹配：多余的 ${ch}`));
          }
        }
      }
      if (quote) {
        diagnostics.push(diagnosticAt(text, Math.max(0, text.length - 1), `字符串没有闭合：${quote}`));
      }
      if (blockComment) {
        diagnostics.push(diagnosticAt(text, Math.max(0, text.length - 1), "块注释没有闭合"));
      }
      stack.slice(-10).forEach(open => {
        diagnostics.push(diagnosticAt(text, open.index, `括号没有闭合：${open.char}`));
      });
      if (currentMode === "json") {
        try {
          JSON.parse(text);
        } catch (error) {
          const lineMatch = /line\s+(\d+)\s+column\s+(\d+)/i.exec(error.message);
          const positionMatch = /position\s+(\d+)/i.exec(error.message);
          let line = 0;
          let ch = 0;
          if (lineMatch) {
            line = Math.max(0, Number(lineMatch[1]) - 1);
            ch = Math.max(0, Number(lineMatch[2]) - 1);
          } else if (positionMatch) {
            const offset = Number(positionMatch[1]);
            const before = text.slice(0, offset);
            line = before.split("\n").length - 1;
            ch = offset - before.lastIndexOf("\n") - 1;
          }
          diagnostics.push({
            from: CodeMirror.Pos(line, ch),
            to: CodeMirror.Pos(line, ch + 1),
            severity: "error",
            message: error.message
          });
        }
      }
      return diagnostics;
    }

    function refreshLocalDiagnostics() {
      localDiagnostics = scanLocalSyntax(editor.getValue());
      editor.performLint();
    }

    function currentDiagnostics() {
      return serverDiagnostics.concat(localDiagnostics);
    }

    function sendPosition() {
      clearTimeout(positionTimer);
      positionTimer = setTimeout(() => {
        const pos = editor.getCursor();
        const api = bridge();
        if (api && api.onCursorChanged) api.onCursorChanged(pos.line + 1, pos.ch + 1);
      }, 80);
    }

    function flushContent() {
      clearTimeout(contentTimer);
      contentTimer = 0;
      const api = bridge();
      if (api && api.onContentChanged) api.onContentChanged(editor.getValue());
    }

    function pocketHint(cm) {
      const cursor = cm.getCursor();
      const token = cm.getTokenAt(cursor);
      const before = cm.getRange({line: cursor.line, ch: 0}, cursor);
      const match = /([A-Za-z_][A-Za-z0-9_]*)$/.exec(before);
      if (!match) return null;
      const word = match[1];
      const start = cursor.ch - word.length;
      const words = new Set(completions[currentMode] || []);
      const source = cm.getValue();
      const symbols = source.match(/[A-Za-z_][A-Za-z0-9_]*/g) || [];
      symbols.slice(0, 1200).forEach(value => {
        if (value.length >= 2) words.add(value);
      });
      const list = Array.from(words)
        .filter(value => value.toLowerCase().startsWith(word.toLowerCase()))
        .sort((a, b) => a.length - b.length || a.localeCompare(b))
        .slice(0, 30);
      if (!list.length) return null;
      return {
        list,
        from: CodeMirror.Pos(cursor.line, start),
        to: cursor
      };
    }

    editor.on("change", () => {
      if (suppressEvents) return;
      currentDirty = true;
      activeSearchMatch = null;
      const api = bridge();
      if (api && api.onDirtyChanged) api.onDirtyChanged(true);
      clearTimeout(contentTimer);
      contentTimer = setTimeout(flushContent, 250);
      clearTimeout(localDiagnosticsTimer);
      localDiagnosticsTimer = setTimeout(refreshLocalDiagnostics, 180);
      if (findPanel.classList.contains("visible")) {
        setTimeout(() => updateFindStatus(), 0);
      }
    });
    editor.on("cursorActivity", sendPosition);
    editor.on("blur", flushContent);
    editor.on("inputRead", (cm, change) => {
      if (!change.origin || !change.origin.startsWith("+")) return;
      const cursor = cm.getCursor();
      const before = cm.getRange({line: cursor.line, ch: 0}, cursor);
      const match = /([A-Za-z_][A-Za-z0-9_]*)$/.exec(before);
      const word = match ? match[1] : "";
      if (word.length >= 2 && word !== lastHintWord) {
        lastHintWord = word;
        clearTimeout(window.hintTimer);
        window.hintTimer = setTimeout(() => {
          cm.showHint({hint: pocketHint, completeSingle: false});
        }, 90);
      }
    });

    window.PocketEditor = {
      setValue(text) {
        suppressEvents = true;
        const cursor = editor.getCursor();
        editor.setValue(text || "");
        editor.setCursor(Math.min(cursor.line, Math.max(0, editor.lineCount() - 1)), 0);
        currentDirty = false;
        suppressEvents = false;
        localDiagnostics = scanLocalSyntax(editor.getValue());
        editor.performLint();
        setTimeout(() => editor.refresh(), 0);
        if (findPanel.classList.contains("visible")) {
          setTimeout(() => updateFindStatus(), 0);
        }
      },
      setMode(mode) {
        currentMode = mode in modes ? mode : "plain";
        editor.setOption("mode", modes[currentMode]);
        localDiagnostics = scanLocalSyntax(editor.getValue());
        editor.performLint();
        setTimeout(() => editor.refresh(), 0);
      },
      getValue() {
        return editor.getValue();
      },
      focus() {
        editor.focus();
      },
      showCompletions() {
        editor.showHint({hint: pocketHint, completeSingle: false});
      },
      openSearch() {
        openSearch();
      },
      setDiagnostics(diagnostics) {
        serverDiagnostics = (Array.isArray(diagnostics) ? diagnostics : []).map(item => {
          if (item.from) return item;
          const line = Math.max(0, Number(item.line) || 0);
          const ch = Math.max(0, Number(item.ch) || 0);
          return {
            from: CodeMirror.Pos(line, ch),
            to: CodeMirror.Pos(line, ch + 1),
            severity: item.severity || "error",
            message: item.message || "语法错误"
          };
        });
        editor.performLint();
      },
      flush() {
        flushContent();
      }
    };

    setTimeout(() => {
      editor.refresh();
      const api = bridge();
      if (api && api.onReady) api.onReady();
    }, 30);
  </script>
</body>
</html>
