plugins {
    id 'com.android.library'
}

android {
    namespace 'com.termux.terminal'
    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
